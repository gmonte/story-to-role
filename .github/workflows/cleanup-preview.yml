name: cleanup pr preview

on:
  pull_request:
    types: [closed]
    # Only pull requests into staging get a preview; release PRs into main don't.
    branches:
      - staging

env:
  VERCEL_CLI_VERSION: "67.0.0"

jobs:
  cleanup:
    name: cleanup pr preview
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm i -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Remove the PR deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
        run: |
          vercel link --token $VERCEL_TOKEN --project $VERCEL_PROJECT_NAME --yes

          PREVIEW_URL="pr-${{ github.event.pull_request.number }}-storytorole.vercel.app"
          OLD_DEPLOY_URL=$(vercel inspect "$PREVIEW_URL" --token $VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1 || true)
          if [ -n "$OLD_DEPLOY_URL" ]; then
            echo "Removing PR deployment: $OLD_DEPLOY_URL"
            vercel rm "$OLD_DEPLOY_URL" --token $VERCEL_TOKEN --yes || true
          fi

      - name: Delete the PR's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          DB_BRANCH="preview/pr-${{ github.event.pull_request.number }}"
          # Most PRs have no branch (no new migration): nothing to delete.
          npx -y neonctl@9 branches delete "$DB_BRANCH" --project-id "$NEON_PROJECT_ID" || echo "No Neon branch $DB_BRANCH"
