name: guard main

on:
  pull_request:
    branches:
      - main

jobs:
  ensure-source-is-staging:
    name: ensure source is staging
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "::error::Only the 'staging' branch can open PRs into main. Source: ${{ github.head_ref }}"
            exit 1
          fi
