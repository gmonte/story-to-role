name: pr

on:
  pull_request:
    branches:
      - staging

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 24.14.1
  SKIP_ENV_VALIDATION: "true"
  NODE_DISABLE_COMPILE_CACHE: "1"
  NODE_OPTIONS: --no-node-snapshot
  VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed.txt
          if grep -E '\.(ts|tsx|js|jsx)$|configs/|package\.json$|eslint\.config\.|tsconfig.*\.json$' changed.txt > lint_files.txt; then
            echo "has_relevant_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_relevant_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Files to lint:"
          cat lint_files.txt || true

      - name: Setup Node.js
        if: steps.changes.outputs.has_relevant_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: steps.changes.outputs.has_relevant_changes == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        if: steps.changes.outputs.has_relevant_changes == 'true'
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.changes.outputs.has_relevant_changes == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        if: steps.changes.outputs.has_relevant_changes == 'true'
        run: pnpm lerna run lint,test --verbose

  preview:
    name: preview
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview env
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt \
            --meta prNumber="${{ github.event.pull_request.number }}" \
            --meta branch="${{ github.head_ref }}" \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias preview to pr-${{ github.event.pull_request.number }}
        run: |
          npx vercel alias set "${{ steps.deploy.outputs.url }}" "pr-${{ github.event.pull_request.number }}-storytorole.vercel.app" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prune older deployments for this PR
        continue-on-error: true
        run: |
          PR="${{ github.event.pull_request.number }}"
          IDS=$(curl -sf -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&teamId=${{ secrets.VERCEL_TEAM_ID }}&meta-prNumber=$PR&limit=100" \
            | jq -r '.deployments[1:][].uid')
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting $id"
            curl -sf -X DELETE -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v13/deployments/$id?teamId=${{ secrets.VERCEL_TEAM_ID }}" \
              && echo "  ok" || echo "  failed"
          done <<< "$IDS"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview deployed: https://pr-${{ github.event.pull_request.number }}-storytorole.vercel.app
