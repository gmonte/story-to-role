name: pr

on:
  pull_request:
    branches:
      - staging

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 24.22.3
  SKIP_ENV_VALIDATION: "true"
  NODE_DISABLE_COMPILE_CACHE: "1"
  NODE_OPTIONS: --no-node-snapshot
  VERCEL_CLI_VERSION: "65.16.0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Always the full check: the Nx Cloud cache skips whatever did not
      # change, and file-based filters skipped quality on .sql-only PRs.
      - name: Lint, typecheck and test
        env:
          # Nx Cloud remote cache: quality jobs only (see docs/adr/0005).
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm lerna run lint,test --verbose

  preview:
    name: preview
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The database branch check diffs the migrations against staging.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # The Vercel build runs `db:migrate` (predeploy), so a PR that adds a
      # migration gets its own Neon branch, cloned from staging's, and never
      # migrates the shared staging database before it is merged. A branch,
      # once created, is reused by every later push until the PR closes.
      - name: Database branch
        id: db-branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
        run: |
          DB_BRANCH="preview/pr-${{ github.event.pull_request.number }}"

          NEW_MIGRATIONS=$(git diff --diff-filter=A --name-only "origin/${{ github.base_ref }}...HEAD" -- 'packages/api/drizzle/*.sql')
          BRANCH_EXISTS=$(npx -y neonctl@9 branches list --project-id "$NEON_PROJECT_ID" --output json | grep -c "\"$DB_BRANCH\"" || true)

          if [ -z "$NEW_MIGRATIONS" ] && [ "$BRANCH_EXISTS" = "0" ]; then
            echo "No new migrations: the preview uses the staging database"
            exit 0
          fi

          # No `|| true`: a failed create stops the job before any deploy, so
          # the migration can never fall back to the staging database.
          if [ "$BRANCH_EXISTS" = "0" ]; then
            echo "Creating Neon branch $DB_BRANCH from $NEON_PARENT_BRANCH"
            npx -y neonctl@9 branches create --name "$DB_BRANCH" --parent "$NEON_PARENT_BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null
          else
            echo "Reusing Neon branch $DB_BRANCH"
          fi

          # The connection string carries the password: mask it in the log.
          DB_URL=$(npx -y neonctl@9 connection-string "$DB_BRANCH" --pooled --project-id "$NEON_PROJECT_ID")
          echo "::add-mask::$DB_URL"
          echo "database-url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          DATABASE_URL: ${{ steps.db-branch.outputs.database-url }}
        run: |
          vercel link --token $VERCEL_TOKEN --project $VERCEL_PROJECT_NAME --yes

          PREVIEW_URL="pr-${{ github.event.pull_request.number }}-storytorole.vercel.app"
          OLD_DEPLOY_URL=$(vercel inspect "$PREVIEW_URL" --token $VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1 || true)

          # APP_URL is the alias the deployment is served from, which Vercel
          # doesn't expose on its own (getBaseUrl reads it). Previews share one
          # Upstash database, so each gets its own REDIS_KEY_PREFIX.
          REDIS_KEY_PREFIX="pr-${{ github.event.pull_request.number }}:"
          # Deploy flags are collected in the positional params so each value
          # stays one quoted argument.
          set -- -b "APP_URL=$PREVIEW_URL" -e "APP_URL=$PREVIEW_URL" -b "REDIS_KEY_PREFIX=$REDIS_KEY_PREFIX" -e "REDIS_KEY_PREFIX=$REDIS_KEY_PREFIX"

          if [ -n "$DATABASE_URL" ]; then
            echo "Deploying against the PR's own Neon branch"
            set -- "$@" -b "DATABASE_URL=$DATABASE_URL" -e "DATABASE_URL=$DATABASE_URL"
          fi

          DEPLOY_URL=$(vercel deploy --token $VERCEL_TOKEN --target preview "$@")
          vercel alias --token $VERCEL_TOKEN set "$DEPLOY_URL" "$PREVIEW_URL"

          # Remove the previous deployment of this PR to stay within free plan limits
          if [ -n "$OLD_DEPLOY_URL" ]; then
            echo "Removing previous PR deployment: $OLD_DEPLOY_URL"
            vercel rm "$OLD_DEPLOY_URL" --token $VERCEL_TOKEN --yes || true
          fi

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview deployed: https://pr-${{ github.event.pull_request.number }}-storytorole.vercel.app
