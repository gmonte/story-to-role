name: staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 24.14.1
  SKIP_ENV_VALIDATION: "true"
  NODE_DISABLE_COMPILE_CACHE: "1"
  NODE_OPTIONS: --no-node-snapshot
  VERCEL_CLI_VERSION: "65.16.0"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        env:
          # Nx Cloud remote cache: quality jobs only (see docs/adr/0005).
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm lerna run lint,test --verbose

  deploy-staging:
    name: deploy staging
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Deploy staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
        run: |
          vercel link --token $VERCEL_TOKEN --project $VERCEL_PROJECT_NAME --yes

          STAGING_URL="stg-storytorole.vercel.app"

          # Get the current staging deployment before deploying the new one
          OLD_DEPLOY_URL=$(vercel inspect "$STAGING_URL" --token $VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1 || true)

          # APP_URL is the alias the deployment is served from, which Vercel
          # doesn't expose on its own (getBaseUrl reads it). Previews share one
          # Upstash database, so each gets its own REDIS_KEY_PREFIX.
          REDIS_KEY_PREFIX="stg:"
          DEPLOY_URL=$(vercel deploy --token $VERCEL_TOKEN --target preview -b "APP_URL=$STAGING_URL" -e "APP_URL=$STAGING_URL" -b "REDIS_KEY_PREFIX=$REDIS_KEY_PREFIX" -e "REDIS_KEY_PREFIX=$REDIS_KEY_PREFIX")
          vercel alias --token $VERCEL_TOKEN set "$DEPLOY_URL" "$STAGING_URL"

          # Remove the previous staging deployment to stay within free plan limits
          if [ -n "$OLD_DEPLOY_URL" ]; then
            echo "Removing previous staging deployment: $OLD_DEPLOY_URL"
            vercel rm "$OLD_DEPLOY_URL" --token $VERCEL_TOKEN --yes || true
          fi
