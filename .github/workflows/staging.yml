name: staging

on:
  push:
    branches:
      - staging

concurrency:
  group: staging
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: 24.14.1
  SKIP_ENV_VALIDATION: "true"
  NODE_DISABLE_COMPILE_CACHE: "1"
  NODE_OPTIONS: --no-node-snapshot
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        env:
          # Nx Cloud remote cache: quality jobs only (see docs/adr/0005).
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm lerna run lint,test --verbose

  deploy-staging:
    name: deploy staging
    needs: quality
    # Deploys stay off until the repository variable DEPLOY_ENABLED is set to
    # "true" (Settings > Secrets and variables > Actions > Variables).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            apps/*/node_modules
            configs/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(npx vercel deploy \
            --meta branch=staging \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias staging to stg-storytorole.vercel.app
        run: |
          npx vercel alias set "${{ steps.deploy.outputs.url }}" "stg-storytorole.vercel.app" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prune older staging deployments
        continue-on-error: true
        run: |
          IDS=$(curl -sf -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&teamId=${{ secrets.VERCEL_ORG_ID }}&meta-branch=staging&limit=100" \
            | jq -r '.deployments[1:][].uid')
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting $id"
            curl -sf -X DELETE -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v13/deployments/$id?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              && echo "  ok" || echo "  failed"
          done <<< "$IDS"
