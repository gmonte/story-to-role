packages:
  - "apps/*"
  - "configs/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@scarf/scarf': true
  esbuild: true
  nx: true
  sharp: true

catalogs:
  ai:
    "@anthropic-ai/sdk": 1.8.0

  api:
    "@trigger.dev/build": 4.8.5
    "@trigger.dev/sdk": 4.8.5
    # 2.1+ sends Lua scripts with an Upstash-only flag (allow-key-locking)
    # that the local Redis behind SRH rejects; stay on 2.0.x.
    "@upstash/ratelimit": 2.0.8
    "@upstash/redis": 1.41.0
    "@vercel/blob": 2.9.0
    drizzle-kit: 0.31.10
    drizzle-orm: 0.45.2
    drizzle-zod: 0.8.3
    mammoth: 1.13.0
    postgres: 3.4.8
    trigger.dev: 4.8.5
    unpdf: 2.2.0

  common:
    "@hookform/resolvers": 5.2.2
    "@tanstack/react-query": 5.96.1
    "@trpc/client": 11.16.0
    "@trpc/server": 11.16.0
    "@trpc/tanstack-react-query": 11.16.0
    "@types/node": 24.12.0
    react-hook-form: 7.72.0
    superjson: 2.2.6
    tsx: 4.21.0
    type-fest: 5.5.0
    typescript: 5.9.3
    zod: 4.3.6

  intl:
    "@formatjs/cli": 6.14.1
    "@formatjs/intl": 4.1.5
    "@formatjs/intl-localematcher": 0.8.2
    babel-plugin-formatjs: 11.3.2
    react-intl: 10.1.1

  quality:
    "@eslint/js": 9.39.4
    "@next/eslint-plugin-next": 16.2.2
    "@tanstack/eslint-plugin-query": 5.96.1
    eslint: 9.39.4
    eslint-config-prettier: 10.1.8
    eslint-plugin-check-file: 3.3.1
    eslint-plugin-formatjs: 6.4.3
    eslint-plugin-import: 2.32.0
    eslint-plugin-prettier: 5.5.5
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 7.0.1
    globals: 17.4.0
    lint-staged: 16.4.0
    prettier: 3.8.1
    prettier-plugin-tailwindcss: 0.7.2
    typescript-eslint: 8.58.0

  root:
    "@commitlint/cli": 20.5.0
    "@commitlint/config-conventional": 20.5.0
    commitizen: 4.3.1
    cz-pnpm-workspace-changelog: 3.0.10
    husky: 9.1.7
    lerna: 9.0.7

  testing:
    "@electric-sql/pglite": 0.4.3
    "@testing-library/react": 16.3.2
    "@vitejs/plugin-react": 6.0.1
    "@vitest/coverage-v8": 4.1.2
    jsdom: 29.0.1
    vitest: 4.1.2

  web:
    "@clerk/localizations": 4.3.0
    "@clerk/nextjs": 7.3.3
    "@t3-oss/env-nextjs": 0.13.11
    "@trigger.dev/react-hooks": 4.8.5
    "@tailwindcss/postcss": 4.2.2
    "@types/react": 19.2.14
    "@types/react-dom": 19.2.3
    "@types/swagger-ui-dist": 3.30.6
    babel-plugin-react-compiler: 1.0.0
    class-variance-authority: 0.7.1
    clsx: 2.1.1
    lucide-react: 1.7.0
    next: 16.2.1
    next-themes: 0.4.6
    radix-ui: 1.4.3
    react: 19.2.4
    react-dom: 19.2.4
    server-only: 0.0.1
    sonner: 2.0.7
    swagger-ui-dist: 5.32.1
    tailwind-merge: 3.5.0
    tailwindcss: 4.2.2
    trpc-to-openapi: 3.2.0
    tw-animate-css: 1.4.0
    zod-openapi: 5.4.6

# One @opentelemetry/api for everyone: Trigger.dev's packages need <1.10, and
# a second version as next's optional peer duplicated next in the web bundle.
overrides:
  "@opentelemetry/api": 1.9.1

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
