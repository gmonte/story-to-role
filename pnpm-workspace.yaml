packages:
  - "apps/*"
  - "configs/*"
  - "packages/*"

allowBuilds:
  '@clerk/shared': true
  '@scarf/scarf': true
  esbuild: true
  nx: true
  sharp: true

catalogs:
  ai:
    "@ai-sdk/anthropic": 4.0.107
    "@ai-sdk/react": 4.0.183
    "@anthropic-ai/sdk": 1.12.0
    ai: 7.0.179

  api:
    "@huggingface/transformers": 4.3.2
    "@napi-rs/canvas": 1.2.0
    "@react-pdf/renderer": 4.9.0
    "@trigger.dev/build": 4.8.8
    "@trigger.dev/sdk": 4.8.8
    # 2.1+ sends Lua scripts with an Upstash-only flag (allow-key-locking)
    # that the local Redis behind SRH rejects; stay on 2.0.x.
    "@upstash/ratelimit": 2.0.8
    "@upstash/redis": 1.41.0
    "@vercel/blob": 2.9.0
    drizzle-kit: 0.31.11
    drizzle-orm: 0.45.4
    drizzle-zod: 0.8.3
    fflate: 0.8.3
    mammoth: 1.13.0
    postgres: 4.1.1
    stripe: 23.2.0
    trigger.dev: 4.8.8
    unpdf: 2.2.1

  common:
    "@hookform/resolvers": 7.0.8
    "@tanstack/react-query": 5.108.2
    "@trpc/client": 11.29.7
    "@trpc/server": 11.29.7
    "@trpc/tanstack-react-query": 11.29.7
    # Keep the major aligned with .nvmrc (Node 24).
    "@types/node": 24.19.2
    react-hook-form: 7.92.0
    superjson: 2.2.7
    tsx: 4.23.15
    type-fest: 6.0.3
    # 6.0.x is the newest typescript-eslint supports (peer <6.1.0); 7 is the
    # native compiler and needs typescript-eslint 9+.
    typescript: 6.0.3
    zod: 4.6.7

  intl:
    "@formatjs/cli": 6.20.0
    "@formatjs/icu-messageformat-parser": 3.5.23
    "@formatjs/intl": 6.2.0
    "@formatjs/intl-localematcher": 0.10.1
    # 12+ needs Babel 8; next still bundles Babel 7.
    babel-plugin-formatjs: 11.3.16
    react-intl: 12.2.0

  quality:
    # Experimental: pinned, as Clerk asks (minors may break before 1.0).
    "@clerk/eslint-plugin": 0.2.0
    # Stay on ESLint 9: eslint-plugin-import and eslint-plugin-react declare
    # no ESLint 10 support in their peer ranges (and react uses removed APIs).
    "@eslint/js": 9.39.5
    "@next/eslint-plugin-next": 16.4.6
    "@tanstack/eslint-plugin-query": 5.108.2
    eslint: 9.39.5
    eslint-config-prettier: 10.1.8
    eslint-plugin-check-file: 3.3.2
    # 8.x no longer crashes on @unicode/unicode-17.0.0 (the 6.6.2+ problem).
    # Its stricter default rules are switched off in configs/eslint-config.
    eslint-plugin-formatjs: 8.1.4
    eslint-plugin-import: 2.32.0
    eslint-plugin-prettier: 5.5.7
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 7.1.1
    globals: 17.14.0
    lint-staged: 17.6.2
    prettier: 3.10.1
    prettier-plugin-tailwindcss: 0.8.1
    typescript-eslint: 8.73.0

  root:
    "@commitlint/cli": 21.2.4
    "@commitlint/config-conventional": 21.2.4
    commitizen: 4.3.2
    cz-pnpm-workspace-changelog: 3.0.10
    husky: 9.1.7
    lerna: 10.1.3

  testing:
    "@electric-sql/pglite": 0.5.17
    "@electric-sql/pglite-pgvector": 0.0.18
    "@testing-library/react": 16.3.3
    "@vitejs/plugin-react": 6.3.0
    "@vitest/coverage-v8": 5.1.1
    jsdom: 31.0.1
    vitest: 5.1.1

  web:
    "@clerk/localizations": 4.26.3
    "@clerk/nextjs": 7.10.7
    "@t3-oss/env-nextjs": 0.13.11
    "@tiptap/core": 3.35.0
    "@tiptap/pm": 3.35.0
    "@tiptap/react": 3.35.0
    "@tiptap/starter-kit": 3.35.0
    "@trigger.dev/react-hooks": 4.8.8
    "@tailwindcss/postcss": 4.3.5
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "@types/swagger-ui-dist": 3.30.6
    babel-plugin-react-compiler: 1.0.0
    class-variance-authority: 0.7.1
    clsx: 2.1.1
    lucide-react: 1.77.0
    next: 16.4.6
    next-themes: 0.4.6
    radix-ui: 1.8.1
    react: 19.3.1
    react-dom: 19.3.1
    server-only: 0.0.1
    sonner: 2.0.8
    swagger-ui-dist: 5.35.1
    tailwind-merge: 3.7.1
    tailwindcss: 4.3.5
    trpc-to-openapi: 3.5.0
    tw-animate-css: 1.4.0
    # trpc-to-openapi 3.5.0 peers zod-openapi ^5.4.4; 6.x is not accepted yet.
    zod-openapi: 5.4.6

# One @opentelemetry/api for everyone: Trigger.dev's packages need <1.10, and
# a second version as next's optional peer duplicated next in the web bundle.
overrides:
  "@opentelemetry/api": 1.9.1

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
